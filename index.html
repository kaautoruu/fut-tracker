<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUT Esports Takip</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="vfx-bg"></div>
    <div class="side-panel left-panel" id="valo-form"><h3>VALO</h3></div>
    <div class="side-panel right-panel" id="cs-form"><h3>CS2</h3></div>

    <header>
        <div class="top-social-bar">
            <a href="https://x.com/FUTesportsgg" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.instagram.com/futesportsgg/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.youtube.com/@FUTEsports" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        </div>
        
        <h1>FUT MATCH TRACKER</h1>
        
        <div id="theme-switch" style="cursor:pointer; font-size: 1.2rem; margin-bottom: 20px;">
            <i class="fa-solid fa-moon"></i> / <i class="fa-solid fa-sun"></i>
        </div>

        <nav class="filter-nav">
            <div class="filter-group" style="width: 100%; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <button class="filter-btn active" data-filter="all">HEPSİ</button>
                <button class="filter-btn" data-filter="valorant">VALORANT</button>
                <button class="filter-btn" data-filter="csgo">CS 2</button>
                <button class="filter-btn" data-type="coming-soon" data-name="PUBG Mobile">PUBG-M</button>
                <button class="filter-btn" data-type="coming-soon" data-name="Brawl Stars">BRAWL STARS</button>
            </div>

            <div class="toggle-container" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 25px; border-top: 1px solid rgba(255,78,0,0.1); padding-top: 20px;">
                <span style="font-size: 0.7rem; letter-spacing: 1px; color: var(--text-dim);">GEÇMİŞ</span>
                <label class="switch">
                    <input type="checkbox" id="match-status-toggle" checked>
                    <span class="slider round"></span>
                </label>
                <span style="font-size: 0.7rem; letter-spacing: 1px; color: var(--text-dim);">GELECEK / CANLI</span>
            </div>
        </nav>
    </header>

    <main class="match-container" id="match-list">
        <p style="text-align:center; color: #ff4e00;">Veriler Pandascore'dan çekiliyor...</p>
    </main>

    <footer>
        <p>© 2026 FUT Tracker - kaautoru</p>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js" defer></script>
    
</body>
</html>
