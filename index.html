<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUT Esports Takip</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="side-panel left-panel" id="valo-form"><h3>VALO</h3></div>
    <div class="side-panel right-panel" id="cs-form"><h3>CS2</h3></div>

    <header>
        <div class="top-social-bar">
            <a href="https://x.com/FUTesportsgg" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.instagram.com/futesportsgg/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.youtube.com/@FUTEsports" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        </div>
        
        <h1>FUT MATCH TRACKER</h1>
        
        <div id="theme-switch" style="cursor:pointer; font-size: 1.5rem; margin-bottom: 20px;">
            <i class="fa-solid fa-moon"></i>
            <i class="fa-solid fa-sun"></i>
        </div>

        <nav class="filter-nav">
            <button class="filter-btn active" data-filter="all">HEPSİ</button>
            <button class="filter-btn" data-filter="valorant">VALORANT</button>
            <button class="filter-btn" data-filter="csgo">CS 2</button>
            <button class="filter-btn" data-type="coming-soon" data-name="PUBG Mobile">PUBG-M</button>
            <button class="filter-btn" data-type="coming-soon" data-name="Brawl Stars">BRAWL STARS</button>
        </nav>
    </header>

    <main class="match-container" id="match-list">
        <p style="text-align:center; color: #ff4e00;">Yükleniyor...</p>
    </main>

    <footer>
        <p>© 2026 FUT Tracker - kaautoru</p>
    </footer>

    <script src="app.js"></script> 
</body>
</html>
